<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il mio Portfolio Firebase</title>
    <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { margin-bottom: 40px; }
    .input-group { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); display: flex; gap: 10px; margin-bottom: 30px; }
    input, select, button { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; outline: none; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; transition: 0.2s; font-weight: 600; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    #lista-task { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; border-left: 5px solid var(--primary); text-align: left; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); position: relative; transition: transform 0.2s, background 0.3s, color 0.3s; cursor: pointer; }
    .card:hover { transform: translateY(-5px) scale(1.02); }
    .card.active { background: var(--primary); color: white; }
    .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    .prio-Alta { border-left-color: #ef4444; }
    .btn-delete { background: #fee2e2; color: #ef4444; font-size: 0.8rem; margin-top: 10px; width: 100%; }

    /* theme support */
    [data-theme="dark"] { --bg: #1e293b; --text: #f8fafc; }
    body { transition: background 0.3s, color 0.3s; }
</style>

</head>
<body data-theme="light">
    <div class="container">
        <header class="header">
            <h1>I miei Task dal Cloud</h1>
            <button id="theme-toggle">🌙 Dark Mode</button>
        </header>

        <div class="input-group">
            <input type="text" id="input-task" placeholder="Scrivi un nuovo task..." />
            <select id="select-priorita">
                <option value="Normale">Normale</option>
                <option value="Alta">Alta</option>
                <option value="Bassa">Bassa</option>
            </select>
            <button id="btn-aggiungi">Aggiungi</button>
        </div>

        <div class="filter-group" style="margin-bottom: 20px;">
    <span>Filtra per priorità:</span>
    <button onclick="leggiTask('Tutti')">Tutti</button>
    <button onclick="leggiTask('Alta')" style="background: #ef4444;">Alta</button>
    <button onclick="leggiTask('Media')" style="background: #f59e0b;">Media</button>
    <button onclick="leggiTask('Bassa')" style="background: #10b981;">Bassa</button>
</div>

        <div id="lista-task">
            <p>Caricamento dati...</p>
        </div>
    </div>

    <script type="module">
// Aggiungiamo 'query' e 'where' agli import
import { getFirestore, collection, getDocs, addDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// ... (configurazione e inizializzazione rimangono uguali) ...

// Modifichiamo la funzione: ora accetta un 'filtro' (default 'Tutti')
async function leggiTask(filtro = 'Tutti') {
    const lista = document.getElementById('lista-task');
    lista.innerHTML = 'Filtraggio in corso...';
    
    try {
        let q; // Questa sarà la nostra query
        const collezioneRef = collection(db, 'i_miei_task');

        if (filtro === 'Tutti') {
            q = query(collezioneRef); // Prendi tutto
        } else {
            // Chiedi a Firebase solo i documenti dove la priorità è uguale al filtro
            q = query(collezioneRef, where("priorita", "==", filtro));
        }

        const querySnapshot = await getDocs(q);
        lista.innerHTML = '';

        if (querySnapshot.empty) {
            lista.innerHTML = `<p>Nessun task con priorità ${filtro}.</p>`;
            return;
        }

        querySnapshot.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = `card prio-${data.priorita}`;
            div.innerHTML = `
                <h3>📌 ${data.attivita}</h3>
                <p>Priorità: <strong>${data.priorita}</strong></p>
            `;
            lista.appendChild(div);
        });
    } catch (e) {
        console.error("Errore filtro:", e);
    }
}

// Rendiamo la funzione disponibile ai bottoni HTML
window.leggiTask = leggiTask; 

// Caricamento iniziale
leggiTask();
</script>
</body>
</html>
